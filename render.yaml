services:
  - type: web
    name: voyager-travel-agent
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: /api
      - key: LLM_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-3.6-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: travel-planner-agent
      - key: LANGCHAIN_ENDPOINT
        value: https://eu.api.smith.langchain.com
      - key: NOMINATIM_USER_AGENT
        value: voyager-travel-planner/1.0
      - key: HTTP_TIMEOUT_SECONDS
        value: "10.0"
